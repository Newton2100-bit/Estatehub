{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006e0f"><script>(function(){try{if(localStorage.getItem('estatehub-theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('meta[name="theme-color"]').content='#111813'}}catch(e){}})();</script><title>{% block title %}EstateHub{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}?v=estatehub-theme-2"></head><body>{% if messages %}<div class="toast-stack" role="region" aria-label="Action messages">{% for m in messages %}<div class="toast {{m.tags}}" role="{% if m.level_tag == 'error' %}alert{% else %}status{% endif %}" aria-live="{% if m.level_tag == 'error' %}assertive{% else %}polite{% endif %}" aria-atomic="true">{{m}}</div>{% endfor %}</div>{% endif %}<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" title="Switch to dark theme" aria-pressed="false" onclick="window.estateHubToggleTheme()"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span></button><script>(function(){var button=document.querySelector('[data-theme-toggle]');var meta=document.querySelector('meta[name="theme-color"]');function sync(){var dark=document.documentElement.dataset.theme==='dark';var label=dark?'Light mode':'Dark mode';button.setAttribute('aria-pressed',String(dark));button.setAttribute('aria-label','Switch to '+(dark?'light':'dark')+' theme');button.title='Switch to '+(dark?'light':'dark')+' theme';button.querySelector('.theme-toggle-icon').textContent=dark?'☀':'☾';button.querySelector('.theme-toggle-label').textContent=label;if(meta)meta.content=dark?'#111813':'#006e0f'}window.estateHubToggleTheme=function(){var dark=document.documentElement.dataset.theme!=='dark';if(dark)document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;try{localStorage.setItem('estatehub-theme',dark?'dark':'light')}catch(e){}sync()};sync()})();</script>{% block body %}{% endblock %}<script src="{% static 'js/app.js' %}"></script></body></html>
