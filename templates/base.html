{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006e0f"><title>{% block title %}EstateHub{% endblock %}</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body>{% if messages %}<div class="toast-stack" role="region" aria-label="Action messages">{% for m in messages %}<div class="toast {{m.tags}}" role="{% if m.level_tag == 'error' %}alert{% else %}status{% endif %}" aria-live="{% if m.level_tag == 'error' %}assertive{% else %}polite{% endif %}" aria-atomic="true">{{m}}</div>{% endfor %}</div>{% endif %}{% block body %}{% endblock %}<script src="{% static 'js/app.js' %}"></script></body></html>
